# Publishes ModelingEvolution.WeldingMachine.Seeed.Plugin to the ModelingEvolution feed AND nuget.org on a vX.Y.Z tag.
#
# SELF-HOSTED x64 runner (the org runner group allows public repos since 2026-10-01): GitHub-hosted runners
# cannot reach nuget.modelingevolution.com. The runner has no sudo, so the SDK installs into
# runner.temp — DOTNET_INSTALL_DIR must be on the setup step, not the job (the `runner` context is not
# available in jobs.<id>.env). Neither push is continue-on-error: a silent failure is a release that published nothing.
name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

jobs:
  plugin:
    runs-on: [self-hosted, x64]
    # nuget.org is pushed with a TEMPORARY key from Trusted Publishing (OIDC): `id-token: write` lets
    # NuGet/login mint it; the nuget.org policy names this repository AND this workflow file.
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    env:
      PLUGIN_CSPROJ: src/ModelingEvolution.WeldingMachine.Seeed.Plugin/ModelingEvolution.WeldingMachine.Seeed.Plugin.csproj
      TESTS_CSPROJ: src/ModelingEvolution.WeldingMachine.Seeed.Plugin.Tests/ModelingEvolution.WeldingMachine.Seeed.Plugin.Tests.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      # The runner's /usr/lib/dotnet (SDK 8) can still win on PATH; v1.0.0's first run restored with it and
      # failed NETSDK1045. Put the SDK setup-dotnet installed first, and say which one is used.
      # setup-dotnet can report "already installed" for an SDK that lives in another dotnet root on this
      # runner, so find the root that really has a 10.x SDK rather than assuming a path.
      - name: Use a .NET 10 SDK
        run: |
          for root in "${{ runner.temp }}/dotnet" "$DOTNET_ROOT" "$HOME/.dotnet" /usr/share/dotnet /usr/lib/dotnet /opt/dotnet; do
            [ -x "$root/dotnet" ] || continue
            if "$root/dotnet" --list-sdks 2>/dev/null | grep -q '^10\.'; then
              echo "Using $root"; "$root/dotnet" --list-sdks | grep '^10\.'
              echo "$root" >> "$GITHUB_PATH"; echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"; exit 0
            fi
          done
          # tycho: setup-dotnet found sdk/10.0.401 in runner.temp but installs with --skip-non-versioned-files,
          # so that root had no `dotnet` executable (v1.0.1's first run). Install a complete SDK, muxer
          # included, into a persistent per-user directory — no sudo, reused by later runs.
          root="$HOME/.dotnet-ci"
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$root"
          "$root/dotnet" --list-sdks | grep -q '^10\.' || { echo "::error::No .NET 10 SDK on this runner"; exit 1; }
          echo "Using $root (installed)"; echo "$root" >> "$GITHUB_PATH"; echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"

      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Restore
        run: |
          dotnet restore "$PLUGIN_CSPROJ"
          dotnet restore "$TESTS_CSPROJ"

      - name: Build
        run: dotnet build "$TESTS_CSPROJ" -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test (hardware-free)
        run: dotnet test "$TESTS_CSPROJ" -c Release --no-build --filter "Category!=Hardware"

      - name: Pack
        run: dotnet pack "$PLUGIN_CSPROJ" -c Release --no-build --output ./nupkg -p:Version=${{ steps.ver.outputs.version }}

      # PluginStager hard-fails unless <PackageId>.dll is in lib/<tfm>/ — check it before the push.
      - name: Verify the package
        run: |
          PKG=./nupkg/ModelingEvolution.WeldingMachine.Seeed.Plugin.${{ steps.ver.outputs.version }}.nupkg
          test -f "$PKG" || { echo "::error::$PKG not packed"; ls -la ./nupkg; exit 1; }
          unzip -l "$PKG" | grep -q "lib/net10.0/ModelingEvolution.WeldingMachine.Seeed.Plugin.dll" \
            || { echo "::error::plugin dll missing from lib/net10.0"; unzip -l "$PKG"; exit 1; }

      - name: Push to the ModelingEvolution feed
        id: push
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY_ME }}
          --source https://nuget.modelingevolution.com/v3/index.json
          --timeout 60
          --skip-duplicate

      - name: Verify the package is fetchable from the feed
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: bash ci/verify-feed.sh

      # The repository is public, so the package is too. Our feed first (rw2 installs from it), then
      # nuget.org. The login comes immediately before the push: the temporary key lives one hour and each
      # OIDC token buys exactly one key.
      - name: NuGet login (OIDC -> temporary key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The POLICY CREATOR's nuget.org username — not the package owner (the ModelingEvolution org).
          user: rafal.maciag

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
